name: UI validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: moimashinani
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runner -d moimashinani"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:5432/moimashinani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Initialize test database
        run: |
          npm run db:migrate
          npm run seed:production
          npm run seed
      - name: Unit checks
        run: |
          npm run test:templates
          npm run test:onboarding:integrity
          npm run test:engine
          npm run test:mail
      - name: Production build
        run: npm run build
